services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authkit}
      POSTGRES_USER: ${POSTGRES_USER:-authkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authkit} -d ${POSTGRES_DB:-authkit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  authkit:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHKIT_ENV: production
      AUTHKIT_ISSUER: ${AUTHKIT_ISSUER:-https://auth.example.com}
      AUTHKIT_DATABASE_URL: postgres://${POSTGRES_USER:-authkit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-authkit}
      AUTHKIT_SIGNING_KEY_KEK: ${AUTHKIT_SIGNING_KEY_KEK}
      AUTHKIT_SESSION_PEPPER: ${AUTHKIT_SESSION_PEPPER}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "authkit-server", "doctor"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
