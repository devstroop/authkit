[package]
name = "authkit-server"
description = "AuthKit native server, administration UI, and CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
authkit-core.workspace = true
authkit-store.workspace = true
axum.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lib]
name = "authkit_server"
path = "src/lib.rs"

[[bin]]
name = "authkit-server"
path = "src/main.rs"
