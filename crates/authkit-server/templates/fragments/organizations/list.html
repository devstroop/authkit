{% import "macros/ui.html" as ui %}
<ul id="organizations" aria-live="polite" style="list-style:none;padding:0;margin:0 0 var(--space-5);">
{% for org in organizations %}
<li style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-4);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:var(--space-2);background:var(--surface);">
  <div>
    <div style="font-weight:600;">{{ org.name }}</div>
    <div style="font-size:0.85rem;color:var(--muted);">{{ org.slug }}</div>
  </div>
  <a href="/organizations/{{ org.id }}/members" style="font-weight:500;font-size:0.9rem;">{{ crate::i18n::t("manage") }} →</a>
</li>
{% endfor %}
{% if organizations.is_empty() %}
<li style="color:var(--muted);padding:var(--space-4);text-align:center;">{{ crate::i18n::t("no_organizations_yet") }}</li>
{% endif %}
</ul>
