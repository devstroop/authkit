{% import "macros/ui.html" as ui %}
<ul id="members">
{% for member in members %}
<li>{{ member.email }} {{ member.status }} ({{ member.id }})</li>
{% endfor %}
</ul>
{% if can_manage %}
<h2>Add member</h2>
<form method="post" action="/organizations/{{ org_id }}/members" hx-post="/organizations/{{ org_id }}/members" hx-target="#members" hx-swap="beforeend">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  {{ ui::text_input("email", "User email", "email", "email") }}
  {{ ui::button("Add") }}
</form>
{% endif %}
