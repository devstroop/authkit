<ul id="oauth-clients">
{% for client in clients %}
<li>{{ client.name }} ({{ client.client_id }}) - {{ client.status }} <a href="/organizations/{{ org_id }}/oauth-clients/{{ client.id }}">Manage</a></li>
{% endfor %}
</ul>
{% if can_manage %}
<h2>Create OAuth client</h2>
<form method="post" action="/organizations/{{ org_id }}/oauth-clients" hx-post="/organizations/{{ org_id }}/oauth-clients" hx-target="#oauth-clients" hx-swap="outerHTML">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label>Application
    <select name="application_id">
      {% for app in apps %}
      <option value="{{ app.id }}">{{ app.name }}</option>
      {% endfor %}
    </select>
  </label><br>
  <label>Name <input name="name" required></label><br>
  <label>Client type
    <select name="client_type">
      <option value="public">public</option>
      <option value="confidential">confidential</option>
    </select>
  </label><br>
  <label>Redirect URI <input name="redirect_uri" required></label><br>
  <label>Scopes <input name="scopes" value="openid profile email"></label><br>
  <button type="submit">Create</button>
</form>
{% endif %}
