{% extends "layouts/admin.html" %}
{% import "macros/ui.html" as ui %}
{% block admin_content %}
<h1>Enroll MFA</h1>
<p>Secret: <code>{{ secret }}</code></p>
<form method="post" action="/admin/mfa/verify">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  {{ ui::text_input("code", "Code", "text", "") }}
  {{ ui::button("Verify") }}
</form>
{% endblock %}
