{% extends "layouts/base.html" %}
{% block content %}
<h1>{{ crate::i18n::t("register") }}</h1>
<form method="post" action="/register">
  {% if !csrf.is_empty() %}
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  {% endif %}
  {% if !next.is_empty() %}
  <input type="hidden" name="next" value="{{ next }}">
  {% endif %}
  <label>Email <input type="email" name="email" required autocomplete="email" aria-required="true"></label>
  <label>Password <input type="password" name="password" type="password" required minlength="12" autocomplete="new-password" aria-required="true"></label>
  <button type="submit">{{ crate::i18n::t("register") }}</button>
</form>
<p><a href="/login">{{ crate::i18n::t("sign_in") }}</a></p>
{% endblock %}
