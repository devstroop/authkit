{% extends "layouts/base.html" %}
{% block content %}
<h1>Sessions</h1>
<ul>
{% for session in sessions %}
<li>{{ session.id }} - {{ session.status }}
  <form method="post" action="/account/sessions/{{ session.id }}/revoke" style="display:inline">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <button type="submit">Revoke</button>
  </form>
</li>
{% endfor %}
</ul>
<h1>Change password</h1>
<form method="post" action="/account/password">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label>Current password <input type="password" name="current_password" type="password" required autocomplete="current-password" aria-required="true"></label><br>
  <label>New password <input type="password" name="new_password" type="password" required minlength="12" autocomplete="new-password" aria-required="true"></label><br>
  <button type="submit">Update password</button>
</form>
{% endblock %}
