{% extends "layouts/base.html" %}
{% import "macros/ui.html" as ui %}
{% block content %}
<div class="auth-card">
  <h1>Select organization</h1>
  <form method="post" action="/select-organization">
    <input type="hidden" name="token" value="{{ token }}">
    {% if !csrf.is_empty() %}
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    {% endif %}
    <fieldset style="border:0;padding:0;margin:var(--space-3) 0;">
      <legend style="font-weight:600;margin-bottom:var(--space-2);">Choose an organization</legend>
      {% for org in orgs %}
      <label style="display:block;margin:var(--space-1) 0;">
        <input type="radio" name="org_id" value="{{ org.id }}" required style="margin-right:var(--space-2);"> {{ org.name }}
      </label>
      {% endfor %}
    </fieldset>
    {{ ui::button("Continue") }}
  </form>
  <p class="links"><a href="/login">Back to sign in</a></p>
</div>
{% endblock %}
