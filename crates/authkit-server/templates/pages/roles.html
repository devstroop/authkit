{% extends "layouts/base.html" %}
{% block content %}
<h1>Roles</h1>
<ul>
{% for role in roles %}
<li>{{ role.name }} ({{ role.slug }}) - {{ role.permissions }}</li>
{% endfor %}
</ul>
{% if can_manage %}
<h2>Create role</h2>
<form method="post" action="/organizations/{{ org_id }}/roles">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label>Slug <input name="slug" required></label><br>
  <label>Name <input name="name" required></label><br>
  <label>Permissions (space-separated) <input name="permissions"></label><br>
  <button type="submit">Create</button>
</form>
{% endif %}
<p><a href="/organizations/{{ org_id }}/members">Members</a></p>
{% endblock %}
