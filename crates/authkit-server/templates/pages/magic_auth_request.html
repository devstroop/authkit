{% extends "layouts/base.html" %}
{% import "macros/ui.html" as ui %}
{% block content %}
<h1>Sign in with email code</h1>
<form method="post" action="/magic-auth">
  {% if !csrf.is_empty() %}
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  {% endif %}
  {{ ui::text_input("email", "Email", "email", "email") }}
  {{ ui::button("Send code") }}
</form>
<p><a href="/login">Sign in with password</a></p>
{% endblock %}
