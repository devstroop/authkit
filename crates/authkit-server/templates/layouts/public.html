{% extends "layouts/base.html" %}
{% block content %}
<div class="public-layout">
  {% block public_content %}{% endblock %}
</div>
{% endblock %}
{% block site_footer %}
<footer class="site-footer">
  <div class="site-footer-inner" style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;">
    <span>© 2026 AuthKit · MIT / Apache-2.0 · Powered by <a href="https://devstroop.com" target="_blank" rel="noopener noreferrer" style="color:var(--muted);text-decoration:none;font-weight:500;">Devstroop</a></span>
    <label style="display:flex;align-items:center;gap:var(--space-2);font-size:0.85rem;color:var(--muted);">
      <span>Language</span>
      <select id="lang-select" class="lang-select" aria-label="Language" onchange="setLang(this.value)">
        <option value="en" {% if crate::i18n::current_locale().as_str() == "en" %}selected{% endif %}>English</option>
        <option value="es" {% if crate::i18n::current_locale().as_str() == "es" %}selected{% endif %}>Español</option>
      </select>
    </label>
  </div>
</footer>
{% endblock %}
