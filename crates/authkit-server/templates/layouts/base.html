<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-fg: #111827;
      --color-muted: #6b7280;
      --color-border: #d1d5db;
      --color-primary: #2563eb;
      --color-primary-fg: #ffffff;
      --color-danger: #dc2626;
      --radius: 0.5rem;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #111827;
        --color-fg: #f9fafb;
        --color-muted: #9ca3af;
        --color-border: #374151;
        --color-primary: #3b82f6;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--color-bg);
      color: var(--color-fg);
      line-height: 1.5;
    }
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .skip-link:focus {
      position: static;
      width: auto;
      height: auto;
      padding: var(--space-2);
      background: var(--color-primary);
      color: var(--color-primary-fg);
    }
    main {
      max-width: 32rem;
      margin: var(--space-4) auto;
      padding: 0 var(--space-3);
    }
    .field { display: block; margin: var(--space-2) 0; }
    .input {
      width: 100%;
      padding: var(--space-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }
    .btn {
      padding: var(--space-2) var(--space-3);
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-primary-fg);
    }
    .alert { color: var(--color-danger); }
    a { color: var(--color-primary); }
    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    .admin-layout { display: grid; grid-template-columns: 12rem 1fr; gap: var(--space-4); max-width: 64rem; margin: 0 auto; }
    .admin-nav { display: flex; flex-direction: column; gap: var(--space-2); }
    .admin-nav a, .admin-nav button { text-align: left; }
    @media (max-width: 40rem) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-nav { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
  <script src="/static/htmx.min.js" defer></script>
  <script defer>
    document.addEventListener("htmx:afterSwap", function (event) {
      var target = event.detail.target;
      if (target && target.getAttribute && target.getAttribute("aria-live")) {
        return;
      }
      var heading = document.querySelector("main h1");
      if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus(); }
    });
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" aria-live="polite">
    {% block content %}{% endblock %}
  </main>
<script>
(function(){var m=document.cookie.match(/(?:^|; )authkit_impersonating=([^;]*)/);if(m){var b=document.createElement("div");b.style.cssText="position:fixed;top:0;left:0;right:0;background:#f59e0b;color:#000;padding:.5rem;text-align:center;z-index:9999";b.textContent="Impersonating a user";var x=document.createElement("form");x.method="post";x.action="/admin/impersonate/exit";var btn=document.createElement("button");btn.type="submit";btn.textContent="Exit";x.appendChild(btn);b.appendChild(x);document.body.prepend(b);}})();
</script>
</body>
</html>
