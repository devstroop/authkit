<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #f6f4ef;
      --color-bg-2: #eeec e5;
      --color-surface: #ffffff;
      --color-fg: #1a1816;
      --color-muted: #6b6660;
      --color-border: #d9d5cc;
      --color-primary: #0d7c66;
      --color-primary-fg: #ffffff;
      --color-primary-hover: #0a6352;
      --color-danger: #b91c1c;
      --color-danger-bg: #fef2f2;
      --radius: 0.75rem;
      --radius-sm: 0.5rem;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --space-6: 3rem;
      --font-display: "Instrument Serif", Georgia, serif;
      --font-body: "Manrope", system-ui, sans-serif;
      --shadow: 0 1px 2px rgba(20,18,16,0.04), 0 8px 24px rgba(20,18,16,0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0e0d0b;
        --color-bg-2: #15140f;
        --color-surface: #1a1916;
        --color-fg: #f2f0ea;
        --color-muted: #9a958c;
        --color-border: #2e2c27;
        --color-primary: #34d399;
        --color-primary-fg: #0e0d0b;
        --color-primary-hover: #6ee7b7;
        --color-danger: #f87171;
        --color-danger-bg: #2a1414;
        --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      background: var(--color-bg);
      color: var(--color-fg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(13,124,102,0.06), transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(13,124,102,0.04), transparent 45%);
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-image:
          radial-gradient(circle at 20% 10%, rgba(52,211,153,0.08), transparent 40%),
          radial-gradient(circle at 80% 90%, rgba(52,211,153,0.05), transparent 45%);
      }
    }
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .skip-link:focus {
      position: static;
      width: auto;
      height: auto;
      padding: var(--space-2);
      background: var(--color-primary);
      color: var(--color-primary-fg);
      border-radius: var(--radius-sm);
    }
    main {
      max-width: 26rem;
      margin: var(--space-6) auto;
      padding: 0 var(--space-4);
    }
    .auth-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-5);
      box-shadow: var(--shadow);
    }
    .auth-card h1 {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 400;
      line-height: 1.1;
      margin: 0 0 var(--space-4);
      letter-spacing: -0.01em;
    }
    .auth-card .subtitle {
      color: var(--color-muted);
      margin: -0.5rem 0 var(--space-4);
      font-size: 0.95rem;
    }
    .field { display: block; margin: var(--space-3) 0; }
    .field > span {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: var(--space-1);
      color: var(--color-fg);
    }
    .input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 1rem;
      background: var(--color-surface);
      color: var(--color-fg);
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .input:hover { border-color: var(--color-muted); }
    .input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 20%, transparent);
    }
    .btn {
      width: 100%;
      padding: 0.625rem 1rem;
      border: 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      background: var(--color-primary);
      color: var(--color-primary-fg);
      transition: background 120ms ease, transform 60ms ease;
      margin-top: var(--space-2);
    }
    .btn:hover { background: var(--color-primary-hover); }
    .btn:active { transform: translateY(1px); }
    .btn-secondary {
      background: transparent;
      color: var(--color-fg);
      border: 1px solid var(--color-border);
    }
    .btn-secondary:hover { background: var(--color-bg-2); }
    .alert {
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      background: var(--color-danger-bg);
      color: var(--color-danger);
      font-size: 0.9rem;
      margin: var(--space-3) 0;
    }
    .field-error { color: var(--color-danger); font-size: 0.875rem; margin-top: var(--space-1); }
    .links { margin-top: var(--space-4); font-size: 0.9rem; color: var(--color-muted); }
    .links a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
    a { color: var(--color-primary); }
    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    .admin-layout { display: grid; grid-template-columns: 14rem 1fr; gap: var(--space-5); max-width: 72rem; margin: var(--space-5) auto; padding: 0 var(--space-4); }
    .admin-nav {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding: var(--space-3);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      height: fit-content;
      position: sticky;
      top: var(--space-4);
    }
    .admin-nav a, .admin-nav button {
      text-align: left;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      color: var(--color-fg);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .admin-nav a:hover, .admin-nav button:hover { background: var(--color-bg-2); }
    .admin-nav a.active { background: var(--color-primary); color: var(--color-primary-fg); }
    .admin-content {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-5);
      box-shadow: var(--shadow);
    }
    .admin-content h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 400;
      margin: 0 0 var(--space-4);
    }
    ul { padding-left: var(--space-4); }
    li { margin: var(--space-1) 0; }
    @media (max-width: 48rem) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-nav { flex-direction: row; flex-wrap: wrap; position: static; }
    }
    @media (max-width: 32rem) {
      main { margin: var(--space-4) auto; }
      .auth-card { padding: var(--space-4); }
      .auth-card h1 { font-size: 1.875rem; }
    }
  </style>
  <script src="/static/htmx.min.js" defer></script>
  <script defer>
    document.addEventListener("htmx:afterSwap", function (event) {
      var target = event.detail.target;
      if (target && target.getAttribute && target.getAttribute("aria-live")) {
        return;
      }
      var heading = document.querySelector("main h1");
      if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus(); }
    });
  </script>
</head>
<body>
  <a class="skip-link" href="#main">{{ crate::i18n::t("skip_to_content") }}</a>
  <main id="main" aria-live="polite">
    {% block content %}{% endblock %}
  </main>
<script>
(function(){var m=document.cookie.match(/(?:^|; )authkit_impersonating=([^;]*)/);if(m){var b=document.createElement("div");b.style.cssText="position:fixed;top:0;left:0;right:0;background:#f59e0b;color:#000;padding:.5rem;text-align:center;z-index:9999";b.textContent="Impersonating a user";var f=document.createElement("form");f.method="post";f.action="/admin/impersonate/exit";var btn=document.createElement("button");btn.type="submit";btn.textContent="Exit";f.appendChild(btn);b.appendChild(f);document.body.prepend(b);}})();
</script>
</body>
</html>
