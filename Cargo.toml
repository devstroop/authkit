[workspace]
resolver = "3"
members = [
  "crates/authkit-core",
  "crates/authkit-store",
  "crates/authkit-server",
  "crates/authkit-worker",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/devstroop/authkit"
authors = ["AuthKit contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
authkit-core = { path = "crates/authkit-core" }
authkit-store = { path = "crates/authkit-store" }
axum = "0.8"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "macros",
  "any",
  "migrate",
  "postgres",
  "runtime-tokio",
  "sqlite",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
